version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vace-postgres
    environment:
      POSTGRES_DB: vace_db
      POSTGRES_USER: vace_user
      POSTGRES_PASSWORD: vace_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U vace_user" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vace-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: vace-zap
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8090
      -config api.disablekey=true
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    ports:
      - "8090:8090"
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8090/JSON/core/view/version/ -o /dev/null || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  mobsf:
    image: opensecurity/mobile-security-framework-mobsf:latest
    container_name: vace-mobsf
    ports:
      # Host-side 8002, not MobSF's native 8000: 8000 is commonly bound by
      # other local dev tooling, and 8001 is this project's own backend API
      # (see README.md) - the container still listens on its native 8000
      # internally.
      - "8002:8000"
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8000/ -o /dev/null || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  sonarqube-db:
    image: postgres:16-alpine
    container_name: vace-sonarqube-db
    # No host port mapping - only the sonarqube service talks to this, over
    # the compose network (as "sonarqube-db:5432"), so there's nothing here
    # to collide with vace-postgres's own 5432 on the host.
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U sonar" ]
      interval: 10s
      timeout: 5s
      retries: 5

  sonarqube:
    image: sonarqube:community
    container_name: vace-sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      # SonarQube's bundled Elasticsearch refuses to start unless the host
      # has raised vm.max_map_count; disabling the bootstrap check trades
      # that requirement away for local/dev use.
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLED: "true"
    depends_on:
      sonarqube-db:
        condition: service_healthy
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      # /api/system/health requires admin auth (403 without it) and isn't
      # suitable here; /api/system/status is the unauthenticated
      # liveness endpoint and reports {"status":"UP"} once ready.
      test: [ "CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"' || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

volumes:
  postgres_data:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_logs:
