version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vace-postgres
    environment:
      POSTGRES_DB: vace_db
      POSTGRES_USER: vace_user
      POSTGRES_PASSWORD: vace_password
      POSTGRES_INITDB_ARGS: "-c max_connections=200"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U vace_user" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vace-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: vace-zap
    # -Xmx caps the JVM heap so ZAP fails predictably (a Java OutOfMemoryError
    # inside the scan) instead of silently growing until the host/WSL2 VM's
    # OOM killer kills the whole container mid-scan (observed twice: exit
    # code 137, no in-container error at all). mem_limit below gives the
    # container a bit of headroom over the heap for JVM metaspace/threads,
    # and - more importantly - keeps a kill scoped to this container instead
    # of the OOM killer picking another one sharing the VM's memory.
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8091 -Xmx1536m
      -config api.disablekey=true
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
      -config autoupdate.checkOnStart=false
      -config autoupdate.checkAddonUpdates=false
      -config autoupdate.installAddonUpdates=false
      -config autoupdate.installScannerRules=false
    mem_limit: 2g
    ports:
      # Host and container port both 8091 (not ZAP's usual default 8090,
      # which is commonly bound by other local ZAP containers e.g. other
      # projects' own stacks): ZAP's API/proxy handler routes requests by
      # matching the incoming Host header against its own configured
      # host:port, so a host-side port that differs from what ZAP is
      # actually bound to internally makes it misidentify normal API calls
      # as proxy-forward requests and fail them - keeping them identical
      # avoids that entirely rather than fighting Docker's NAT translation.
      - "8091:8091"
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8091/JSON/core/view/version/ -o /dev/null || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      # ZAP's telemetry/callhome addon makes outbound calls on startup that
      # can hang for several minutes in network-restricted environments
      # before falling through - this stays "starting" (not falsely
      # "unhealthy") through that delay rather than failing fast.
      start_period: 600s

  mobsf:
    image: opensecurity/mobile-security-framework-mobsf:latest
    container_name: vace-mobsf
    ports:
      # Host-side 8002, not MobSF's native 8000: 8000 is commonly bound by
      # other local dev tooling, and 8001 is this project's own backend API
      # (see README.md) - the container still listens on its native 8000
      # internally.
      - "8002:8000"
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8000/ -o /dev/null || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  sonarqube-db:
    image: postgres:16-alpine
    container_name: vace-sonarqube-db
    # No host port mapping - only the sonarqube service talks to this, over
    # the compose network (as "sonarqube-db:5432"), so there's nothing here
    # to collide with vace-postgres's own 5432 on the host.
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U sonar" ]
      interval: 10s
      timeout: 5s
      retries: 5

  sonarqube:
    image: sonarqube:community
    container_name: vace-sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      # SonarQube's bundled Elasticsearch refuses to start unless the host
      # has raised vm.max_map_count; disabling the bootstrap check trades
      # that requirement away for local/dev use.
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLED: "true"
    depends_on:
      sonarqube-db:
        condition: service_healthy
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      # /api/system/health requires admin auth (403 without it) and isn't
      # suitable here; /api/system/status is the unauthenticated
      # liveness endpoint and reports {"status":"UP"} once ready.
      test: [ "CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"' || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

volumes:
  postgres_data:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_logs:
